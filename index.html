<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイコーデリスト</title>
    <style>
        :root {
            --primary-color: #ff69b4;
            --bg-color: #fff0f5;
            --text-color: #333;
        }
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 15px;
        }
        .search-container {
            max-width: 600px;
            margin: 0 auto 15px;
            display: flex;
        }
        .search-container input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            outline: none;
            background: #fff;
        }
        .series-menu {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .series-btn {
            padding: 10px 14px;
            font-size: 13px;
            border: none;
            background-color: #e0e0e0;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            color: #555;
        }
        .series-btn.active {
            background-color: #ff1493;
            color: #fff;
        }
        .bullet-menu {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .bullet-btn {
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            background-color: #ddd;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
        }
        .bullet-btn.active {
            background-color: var(--primary-color);
            color: #fff;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:active {
            transform: scale(0.98);
        }
        .card img {
            width: 100%;
            height: 130px;
            object-fit: contain;
        }
        .card-name {
            font-size: 12px;
            font-weight: bold;
            margin-top: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 420px;
            border-radius: 15px;
            padding: 20px 15px;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
            text-align: center;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 10px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            width: 32px; height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }
        .modal-full-img {
            width: 140px;
            height: 180px;
            object-fit: contain;
            margin: 10px auto;
        }
        .parts-container {
            display: flex;
            justify-content: space-around;
            gap: 6px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .part-box {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 6px;
            flex: 1;
            min-width: 75px;
        }

            width: 60px
