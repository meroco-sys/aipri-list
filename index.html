<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイコーデリスト</title>
    <style>
        :root {
            --primary-color: #ff69b4;
            --bg-color: #fff0f5;
            --text-color: #333;
        }
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 15px;
        }
        .search-container {
            max-width: 600px;
            margin: 0 auto 15px;
            display: flex;
        }
        .search-container input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            outline: none;
            background: #fff;
        }
        .tab-menu {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            background-color: #ddd;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            font-weight: bold;
        }
        .tab-btn.active {
            background-color: var(--primary-color);
            color: #fff;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:active {
            transform: scale(0.98);
        }
        .card img {
            width: 100%;
            height: 130px;
            object-fit: contain;
        }
        .card-name {
            font-size: 13px;
            font-weight: bold;
            margin-top: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card-bullet {
            font-size: 11px;
            color: #666;
            text-align: left;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 420px;
            border-radius: 15px;
            padding: 20px 15px;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
            text-align: center;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 10px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            width: 32px; height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }
        .modal-full-img {
            width: 140px;
            height: 180px;
            object-fit: contain;
            margin: 10px auto;
        }
        .parts-container {
            display: flex;
            justify-content: space-around;
            gap: 6px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .part-box {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 6px;
            flex: 1;
            min-width: 75px;
        }
        .part-box img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
        .part-title {
            background: var(--primary-color);
            color: #fff;
            font-size: 10px;
            padding: 2px;
            border-radius: 4px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <h1>コーデリスト</h1>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="コーデ名や型番で検索 (例: OA3-027)">
    </div>

    <div class="tab-menu" id="tabMenu">
        <button class="tab-btn" data-bullet="1">1弾</button>
        <button class="tab-btn" data-bullet="2">2弾</button>
        <button class="tab-btn active" data-bullet="3">3弾</button>
        <button class="tab-btn" data-bullet="4">4弾</button>
    </div>

    <div class="grid" id="coordinateGrid"></div>

    <div class="modal" id="detailModal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">×</button>
            <div id="modalBullet" class="card-bullet" style="font-weight: bold; color: #ff69b4;"></div>
            <h2 id="modalName" style="font-size: 16px; margin: 5px 0;"></h2>
            <img id="modalFullImg" class="modal-full-img" src="" alt="全体像">
            
            <div class="parts-container" id="modalParts"></div>
        </div>
    </div>

    <script>
        const coordinateData = [
            {
                id: "PM-01",
                bullet: "1弾",
                name: "ハロウィンフリルブルー",
                fullImage: "IMG_6032.jpeg",
                parts: [
                    { type: "トップス", code: "PM1-027", power: 760, image: "IMG_6027.png" },
                    { type: "ボトムス", code: "PM1-028", power: 760, image: "IMG_6028.png" },
                    { type: "シューズ", code: "PM1-029", power: 370, image: "IMG_6029.png" },
                    { type: "アクセ",   code: "PM1-030", power: 350, image: "IMG_6030.png" }
                ]
            }
        ];

        let currentBullet = "3"; // 初期表示を1弾に設定

        const grid = document.getElementById('coordinateGrid');
        const searchInput = document.getElementById('searchInput');
        const tabMenu = document.getElementById('tabMenu');
        const modal = document.getElementById('detailModal');
        const closeModal = document.getElementById('closeModal');

        function renderGrid(bullet, filterKeyword = "") {
            grid.innerHTML = "";
            
            let targetData = coordinateData.filter(item => {
                const matchBullet = filterKeyword ? true : item.bullet === (bullet + "弾");
                const matchKeyword = item.name.toLowerCase().includes(filterKeyword.toLowerCase()) || 
                                     item.parts.some(p => p.code.toLowerCase().includes(filterKeyword.toLowerCase()));
                return matchBullet && matchKeyword;
            });

            if (targetData.length === 0) {
                grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#666;'>該当するコーデが見つかりません</p>";
                return;
            }

            targetData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-bullet">${item.bullet}</div>
                    <img src="${item.fullImage}" alt="${item.name}">
                    <div class="card-name">${item.name}</div>
                `;
                card.addEventListener('click', () => openModal(item));
                grid.appendChild(card);
            });
        }

        function openModal(item) {
            document.getElementById('modalBullet').textContent = item.bullet;
            document.getElementById('modalName').textContent = item.name;
            document.getElementById('modalFullImg').src = item.fullImage;

            const partsContainer = document.getElementById('modalParts');
            partsContainer.innerHTML = "";
            item.parts.forEach(part => {
                partsContainer.innerHTML += `
                    <div class="part-box">
                        <div class="part-title">${part.type}</div>
                        <img src="${part.image}" alt="${part.type}">
                        <div style="font-size: 10px; margin-top:3px; font-weight:bold;">${part.code}</div>
                        <div style="font-size: 10px; color:#e91e63;">バズ: ${part.power}</div>
                    </div>
                `;
            });
            modal.classList.add('active');
        }

        closeModal.addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        tabMenu.addEventListener('click', (e) => {
            if (!e.target.classList.contains('tab-btn')) return;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            currentBullet = e.target.getAttribute('data-bullet');
            searchInput.value = "";
            renderGrid(currentBullet);
        });

        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.trim();
            if (keyword === "") {
                renderGrid(currentBullet);
                return;
            }

            const foundItem = coordinateData.find(item => 
                item.name.toLowerCase().includes(keyword.toLowerCase()) || 
                item.parts.some(p => p.code.toLowerCase().includes(keyword.toLowerCase()))
            );

            if (foundItem) {
                const bulletNumber = foundItem.bullet.replace("弾", "");
                if (currentBullet !== bulletNumber) {
                    currentBullet = bulletNumber;
                    document.querySelectorAll('.tab-btn').forEach(btn => {
                        if (btn.getAttribute('data-bullet') === currentBullet) {
                            btn.classList.add('active');
                        } else {
                            btn.classList.remove('active');
                        }
                    });
                }
            }

            renderGrid(currentBullet, keyword);
        });

        renderGrid(currentBullet);
    </script>
</body>
</html>
