<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイコーデリスト</title>
    <style>
        :root {
            --primary-color: #ff69b4;
            --bg-color: #fff0f5;
            --text-color: #333;
        }
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 15px;
        }
        .search-container {
            max-width: 600px;
            margin: 0 auto 15px;
            display: flex;
        }
        .search-container input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            outline: none;
            background: #fff;
        }
        .series-menu {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .series-btn {
            padding: 10px 14px;
            font-size: 13px;
            border: none;
            background-color: #e0e0e0;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            color: #555;
        }
        .series-btn.active {
            background-color: #ff1493;
            color: #fff;
        }
        .bullet-menu {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .bullet-btn {
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            background-color: #ddd;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
        }
        .bullet-btn.active {
            background-color: var(--primary-color);
            color: #fff;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:active {
            transform: scale(0.98);
        }
        .card img {
            width: 100%;
            height: 130px;
            object-fit: contain;
        }
        .card-name {
            font-size: 12px;
            font-weight: bold;
            margin-top: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 420px;
            border-radius: 15px;
            padding: 20px 15px;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
            text-align: center;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 10px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            width: 32px; height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }
        .modal-full-img {
            width: 140px;
            height: 180px;
            object-fit: contain;
            margin: 10px auto;
        }
        .parts-container {
            display: flex;
            justify-content: space-around;
            gap: 6px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .part-box {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 6px;
            flex: 1;
            min-width: 75px;
        }
        /* QRコード画像とウォーターマークを重ねるラッパー */
        .part-img-wrapper {
            position: relative;
            width: 60px;
            height: 60px;
            margin: 0 auto;
        }
        .part-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* QRコード上の赤字の転載禁止文字 (30%) */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
            font-size: 9px;
            font-weight: bold;
            color: rgba(255, 0, 50, 0.30); /* 30%の薄い赤 */
            line-height: 1.1;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            text-align: center;
        }
        .part-title {
            background: var(--primary-color);
            color: #fff;
            font-size: 10px;
            padding: 2px;
            border-radius: 4px;
            margin-bottom: 4px;
        }
    </style>
</head>

        let currentSeries = "プリマジ";
        let currentBullet = "第1章";

        const grid = document.getElementById('coordinateGrid');
        const searchInput = document.getElementById('searchInput');
        const seriesMenu = document.getElementById('seriesMenu');
        const bulletMenu = document.getElementById('bulletMenu');
        const modal = document.getElementById('detailModal');
        const closeModal = document.getElementById('closeModal');

        function renderBulletMenu() {
            bulletMenu.innerHTML = "";
            const bullets = seriesBullets[currentSeries] || [];
            
            bullets.forEach((bullet) => {
                const btn = document.createElement('button');
                btn.className = `bullet-btn ${bullet === currentBullet ? 'active' : ''}`;
                btn.textContent = bullet;
                btn.setAttribute('data-bullet', bullet);
                bulletMenu.appendChild(btn);
            });
        }

        function renderGrid(filterKeyword = "") {
            grid.innerHTML = "";
            
            let targetData = coordinateData.filter(item => {
                const matchSeriesAndBullet = filterKeyword ? true : (item.series === currentSeries && item.bullet === currentBullet);
                const matchKeyword = item.name.toLowerCase().includes(filterKeyword.toLowerCase()) || 
                                     item.parts.some(p => p.code.toLowerCase().includes(filterKeyword.toLowerCase()));
                return matchSeriesAndBullet && matchKeyword;
            });

            if (targetData.length === 0) {
                grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#666;'>該当するコーデが見つかりません</p>";
                return;
            }

            targetData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${item.fullImage}" alt="${item.name}">
                    <div class="card-name">${item.name}</div>
                `;
                card.addEventListener('click', () => openModal(item));
                grid.appendChild(card);
            });
        }

        function openModal(item) {
            document.getElementById('modalBulletInfo').textContent = `${item.series} / ${item.bullet}`;
            document.getElementById('modalName').textContent = item.name;
            document.getElementById('modalFullImg').src = item.fullImage;

            const partsContainer = document.getElementById('modalParts');
            partsContainer.innerHTML = "";
            item.parts.forEach(part => {
                partsContainer.innerHTML += `
                    <div class="part-box">
                        <div class="part-title">${part.type}</div>
                        <div class="part-img-wrapper">
                            <img src="${part.image}" alt="${part.type}">
                            <div class="watermark">mkr<br>転載禁止</div>
                        </div>
                        <div style="font-size: 10px; margin-top:3px; font-weight:bold;">${part.code}</div>
                    </div>
                `;
            });
            modal.classList.add('active');
        }

        closeModal.addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        seriesMenu.addEventListener('click', (e) => {
            if (!e.target.classList.contains('series-btn')) return;
            document.querySelectorAll('.series-btn').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            
            currentSeries = e.target.getAttribute('data-series');
            currentBullet = seriesBullets[currentSeries][0];
            searchInput.value = "";
            
            renderBulletMenu();
            renderGrid();
        });

        bulletMenu.addEventListener('click', (e) => {
            if (!e.target.classList.contains('bullet-btn')) return;
            document.querySelectorAll('.bullet-btn').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            
            currentBullet = e.target.getAttribute('data-bullet');
            searchInput.value = "";
            renderGrid();
        });

        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.trim();
            if (keyword === "") {
                renderGrid();
                return;
            }

            const foundItem = coordinateData.find(item => 
                item.name.toLowerCase().includes(keyword.toLowerCase()) || 
                item.parts.some(p => p.code.toLowerCase().includes(keyword.toLowerCase()))
            );

            if (foundItem) {
                if (currentSeries !== foundItem.series) {
                    currentSeries = foundItem.series;
                    document.querySelectorAll('.series-btn').forEach(btn => {
                        if (btn.getAttribute('data-series') === currentSeries) {
                            btn.classList.add('active');
                        } else {
                            btn.classList.remove('active');
                        }
                    });
                    renderBulletMenu();
                }
                if (currentBullet !== foundItem.bullet) {
                    currentBullet = foundItem.bullet;
                    document.querySelectorAll('.bullet-btn').forEach(btn => {
                        if (btn.getAttribute('data-bullet') === currentBullet) {
                            btn.classList.add('active');
                        } else {
                            btn.classList.remove('active');
                        }
                    });
                }
            }

            renderGrid(keyword);
        });

        renderBulletMenu();
        renderGrid();
    </script>
</body>
</html>
